[project]
name = "maritime-yolo-v26n"
version = "0.1.0"
description = "Fine-tune YOLO26n for single-class boat and vessel detection"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "albumentations>=2.0,<3",
    "datasets==5.2.0",
    "pillow>=12,<13",
    "ultralytics==8.4.216",
]

[project.optional-dependencies]
cpu = ["torch==2.12.0", "torchvision==0.27.0"]
cuda = ["torch==2.12.0", "torchvision==0.27.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda" }, { index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cu128", extra = "cuda" }, { index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
